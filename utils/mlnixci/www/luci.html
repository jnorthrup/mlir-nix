<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mlnixci</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#1f2733; --mute:#6b7585; --line:#d9dee6; --bg:#eef1f5; --card:#fff; --acc:#2d6cdf; --acc2:#e8f0fd;
          --chg:#c26a0a; --chgbg:#fff6e8; --bad:#c0262d; --ok:#1f8a4c; --live:#e07b00; --bar:#1e2a36; --bar2:#2a3a4a; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--fg); background:var(--bg); }
  a { color:var(--acc); text-decoration:none; cursor:pointer; }
  code, pre, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { position:sticky; top:0; z-index:5; }
  .bar { display:flex; align-items:center; gap:8px; background:var(--bar); color:#e8edf3; padding:0 14px; height:44px; }
  .brand { color:#fff; font-weight:700; font-size:17px; margin-right:auto; white-space:nowrap; }
  .brand small { font-weight:400; color:#9fb0c2; font-size:11px; margin-left:6px; }
  nav { display:flex; flex-wrap:wrap; background:var(--bar2); padding:0 8px; min-height:36px; }
  .top { position:relative; }
  .top > a { display:flex; align-items:center; height:36px; padding:0 11px; color:#d6dee8; white-space:nowrap; font-size:13px; }
  .top > a:hover, .top.on > a { background:#3a5068; color:#fff; }
  .top .n { color:#8ea2b6; font-size:11px; margin-left:4px; }
  .drop { display:none; position:absolute; left:0; top:100%; z-index:6; background:#fff; color:var(--fg); min-width:250px; max-height:70vh;
          overflow:auto; border:1px solid var(--line); border-top:0; box-shadow:0 8px 24px rgba(0,0,0,.15); padding:4px 0; }
  .top:hover .drop { display:block; }
  .drop a { display:flex; justify-content:space-between; gap:12px; padding:5px 14px; color:var(--fg); font-size:13px; }
  .drop a:hover { background:var(--acc2); }
  .drop a span:last-child { color:var(--mute); font-size:12px; }
  #q { width:220px; padding:6px 9px; border-radius:5px; border:1px solid #3c4f63; background:#2b3b4c; color:#fff; font:inherit; font-size:13px; }
  #q::placeholder { color:#9fb0c2; }
  #changes { margin-left:10px; padding:5px 11px; border-radius:5px; background:#33475b; color:#dfe7f0; white-space:nowrap; font-size:13px; }
  #changes.some { background:var(--chg); color:#fff; }
  .sub { display:flex; align-items:center; gap:10px; background:#fff; border-bottom:1px solid var(--line); padding:7px 18px; font-size:12px; color:var(--mute); }
  .sub b { color:var(--fg); }
  #busy { margin-left:auto; color:var(--acc); }
  main { max-width:1180px; margin:16px auto 60px; padding:0 16px; }
  h2 { font-size:20px; margin:4px 0 2px; font-weight:600; }
  .lead { color:var(--mute); margin:0 0 12px; }
  .cbi-section { background:var(--card); border:1px solid var(--line); border-radius:6px; margin:0 0 14px; }
  .cbi-section > .head { display:flex; align-items:baseline; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:#f7f9fb;
                         border-radius:6px 6px 0 0; }
  .cbi-section > .head h3 { margin:0; font-size:14px; font-family:ui-monospace, monospace; }
  .cbi-section > .head .n { color:var(--mute); font-size:12px; }
  .row { display:grid; grid-template-columns: 260px 1fr 150px; gap:12px; padding:10px 14px; border-top:1px solid #eef1f4; align-items:start; }
  .row:first-of-type { border-top:0; }
  .row.changed { background:var(--chgbg); box-shadow: inset 3px 0 0 var(--chg); }
  .row.dirty { box-shadow: inset 3px 0 0 var(--acc); }
  .label { text-align:right; padding-top:4px; }
  .label .name { font-weight:600; font-family:ui-monospace, monospace; font-size:13px; word-break:break-all; }
  .label .kind { color:var(--mute); font-size:11px; margin-top:2px; word-break:break-word; }
  .field { min-width:0; }
  .desc { color:var(--mute); font-size:12px; margin-top:5px; max-height:3.1em; overflow:hidden; cursor:pointer; white-space:pre-wrap; }
  .desc.open { max-height:none; }
  .acts { display:flex; flex-direction:column; gap:5px; align-items:stretch; }
  .badges { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .b { display:inline-flex; gap:4px; align-items:center; padding:1px 7px; border-radius:10px; font-size:11px; background:#eef1f5; color:#4a5566; }
  .b.set { background:#dff3e6; color:#17663a; } .b.default { background:#eef1f5; } .b.template { background:#fdf0cf; color:#7a5a00; }
  .b.chg { background:var(--chg); color:#fff; } .b.live { background:#fff1e0; color:#9a5200; border:1px solid #f3c58f; }
  .b.drift { background:#fde4e4; color:var(--bad); border:1px solid #f1b2b2; }
  .b.rt { background:#fff1e0; color:#9a5200; }
  .note { font-size:12px; color:var(--mute); margin-top:6px; }
  .where { font-size:12px; margin-top:6px; padding:6px 8px; background:#f5f7fa; border-radius:5px; }
  .where code { font-size:11.5px; }
  .err { color:var(--bad); font-size:12px; white-space:pre-wrap; margin-top:5px; max-height:9em; overflow:auto; }
  input, select, textarea { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; padding:5px 7px; border:1px solid #c9d0da; border-radius:4px; background:#fff; color:var(--fg); }
  input[type=text], textarea { width:100%; }
  textarea { min-height:2.2em; }
  select { min-width:180px; max-width:100%; }
  button { font:inherit; font-size:12px; padding:5px 10px; border:1px solid #c9d0da; background:#fff; border-radius:4px; cursor:pointer; white-space:nowrap; }
  button:hover { background:#f3f6fa; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button.primary:hover { background:#255bc0; }
  button.warn { color:var(--bad); border-color:#e8b4b4; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .switch { position:relative; display:inline-block; width:42px; height:22px; vertical-align:middle; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:#c4ccd6; border-radius:22px; transition:.15s; cursor:pointer; }
  .switch span:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + span { background:var(--ok); }
  .switch input:checked + span:before { transform:translateX(20px); }
  .knob { display:flex; align-items:center; gap:12px; }
  .knob svg { cursor:ns-resize; touch-action:none; user-select:none; flex:none; }
  .knob .side { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--mute); }
  .knob input { width:130px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 4px 2px 9px; border-radius:12px; background:var(--acc2); font:12px ui-monospace, monospace; }
  .chip.live-only { background:#fff1e0; }
  .chip button { border:0; background:transparent; padding:0 4px; color:var(--mute); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 12px; }
  .fchip { padding:3px 10px; border-radius:14px; border:1px solid var(--line); background:#fff; font-size:12px; cursor:pointer; }
  .fchip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .fchip .n { opacity:.7; margin-left:4px; }
  .pager { display:flex; gap:8px; align-items:center; color:var(--mute); font-size:12px; margin:0 0 10px; }
  .entries { margin-top:8px; border:1px solid var(--line); border-radius:5px; overflow-x:auto; }
  .entries td.note { word-break:break-word; max-width:240px; }
  .entries table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .entries th { text-align:left; font-weight:600; background:#f5f7fa; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12px; }
  .entries td { padding:6px 8px; border-top:1px solid #eef1f4; vertical-align:top; }
  .entries td.nm { font-family:ui-monospace, monospace; font-weight:600; white-space:nowrap; }
  .entries tr.ov { background:var(--chgbg); }
  .entries .tools { display:flex; gap:8px; align-items:center; padding:7px 8px; background:#fafbfc; border-top:1px solid var(--line); flex-wrap:wrap; }
  .kv { display:inline-block; margin:0 6px 2px 0; font-family:ui-monospace, monospace; font-size:11.5px; }
  .kv i { color:var(--mute); font-style:normal; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c4ccd6; margin-right:5px; }
  .dot.on { background:var(--ok); }
  .addform { display:grid; grid-template-columns: 180px 1fr; gap:6px 10px; padding:10px; background:#fafbfc; border-top:1px solid var(--line); align-items:center; }
  .addform label { text-align:right; font:12px ui-monospace, monospace; color:#3d4a5c; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:12px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .tile h4 { margin:0 0 6px; display:flex; justify-content:space-between; font-size:14px; }
  .tile h4 span { color:var(--mute); font-weight:400; font-size:12px; }
  .tile a { display:inline-block; margin:0 8px 3px 0; font-size:12.5px; }
  .bars div { display:grid; grid-template-columns: 170px 1fr 60px; gap:8px; align-items:center; font-size:12px; margin:2px 0; }
  .bars i { display:block; height:8px; background:var(--acc); border-radius:4px; }
  .bars span:last-child { text-align:right; color:var(--mute); }
  pre { margin:6px 0; padding:9px 11px; background:#f5f7fa; border:1px solid var(--line); border-radius:5px; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  .diff div { font:12px ui-monospace, monospace; white-space:pre-wrap; padding:0 6px; }
  .diff .del { background:#fde4e4; } .diff .add { background:#dff3e6; }
  .rline { padding:6px 0; border-top:1px solid #eef1f4; display:flex; gap:10px; align-items:baseline; font-size:13px; }
  .was { text-decoration:line-through; color:var(--mute); }
  .empty { color:var(--mute); padding:12px 14px; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } .label { text-align:left; } #q { width:140px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#">mlnixci<small>Nix, faceted</small></a>
    <input id="q" placeholder="search options" autocomplete="off">
    <a id="changes" href="#changes">no what-if</a>
  </div>
  <nav id="menu"></nav>
  <div class="sub"><span id="crumbs"></span><span id="stat"></span><span id="busy"></span></div>
</header>
<main id="main"></main>
<script>
"use strict";
// A LuCI-style rendering of an option corpus.  The menu and the counts are the server's compiled facets (query.mlir);
// each row is edited with the widget its facets name (facets.nix: widget, range, crud); what the page asks about one
// option -- its entries, its value in the running system, where it adheres -- is answered on demand by Nix
// (POST /api/facet -> the corpus's eval.nix -> answer.nix).  An edit is a what-if: mlnix evaluates it, nothing is written.
const LIMIT = 100;
const S = { rows: 0, modules: [], states: [], overlay: {}, view: null, module: null, q: "", offset: 0, select: {}, templates: false };
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
function svg(tag, attrs = {}) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const show = (v) => (v === undefined ? "" : typeof v === "string" ? v : JSON.stringify(v));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const key = (p) => p.join("\u0000");
const dotted = (p) => p.map((s) => (/^[A-Za-z_][A-Za-z0-9_'-]*$/.test(s) ? s : JSON.stringify(s))).join(".");

let busyN = 0;
function busy(on, what) {
  busyN += on ? 1 : -1;
  $("#busy").textContent = busyN > 0 ? (what || "working…") : "";
}
async function api(path, body) {
  const init = body === undefined ? (path.startsWith("/api/whatif") ? { method: "POST" } : {})
                                  : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, init);
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch { throw new Error(`${r.status}: ${t.slice(0, 300)}`); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// the facets asked for on demand: one evaluation by mlnix answers every ask
async function ask(asks, what) {
  busy(true, what || "asking Nix…");
  try { return (await api("/api/facet", { ask: asks })).answers; } finally { busy(false); }
}
// a what-if: mlnix evaluates the configuration with it; the reply is the report of what it changes
async function whatIf(route, body, err) {
  if (err) err.textContent = "evaluating with mlnix…";
  busy(true, "evaluating with mlnix…");
  try {
    const r = await api(route, body);
    if (err) err.textContent = "";
    noteReport(r);
    await route_();
    return r;
  } catch (e) { if (err) err.textContent = e.message; else alert(e.message); }
  finally { busy(false); }
}

// ---- the what-if overlay: its leaves, for the header and for undo
function leaves(v, p = [], out = []) {
  if (v && typeof v === "object" && !Array.isArray(v)) { for (const k of Object.keys(v)) leaves(v[k], p.concat([k]), out); }
  else out.push({ path: p, value: v });
  return out;
}
function noteReport(r) {
  S.overlay = JSON.parse(r.overlay || "{}");
  const n = leaves(S.overlay).filter((l) => l.path.length).length;
  const a = $("#changes");
  a.textContent = n ? `${n} what-if${n === 1 ? "" : "s"}` : "no what-if";
  a.className = n ? "some" : "";
}
const inOverlay = (p) => leaves(S.overlay).some((l) => l.path.length >= p.length && same(l.path.slice(0, p.length), p));

// ---- the menu: the module facet's values, grouped by their first segment
function topOf(v) { return /\.nix$|^\//.test(v) ? "local modules" : v.split("/")[0]; }
function buildMenu() {
  const tops = new Map();
  for (const { v, n } of S.modules) {
    const t = topOf(v);
    if (!tops.has(t)) tops.set(t, { name: t, n: 0, subs: [] });
    const e = tops.get(t); e.n += n; e.subs.push({ v, n });
  }
  S.tops = [...tops.values()].sort((a, b) => b.n - a.n);
  const nav = $("#menu");
  nav.replaceChildren();
  const shown = S.tops.slice(0, 8), rest = S.tops.slice(8);
  const item = (label, n, subs) => {
    const d = el("div", { class: "top", "data-top": label },
      el("a", { onclick: () => (subs.length === 1 ? go({ m: subs[0].v }) : null) }, label, el("span", { class: "n" }, n)),
      el("div", { class: "drop" }, subs.sort((a, b) => b.n - a.n).map((s) =>
        el("a", { onclick: () => go({ m: s.v }) }, el("span", {}, s.label || s.v), el("span", {}, s.n)))));
    nav.append(d);
  };
  for (const t of shown) item(t.name, t.n, t.subs.map((s) => ({ ...s, label: s.v.includes("/") && t.name !== "local modules" ? s.v.slice(t.name.length + 1) : s.v })));
  if (rest.length) item("more", rest.reduce((a, t) => a + t.n, 0), rest.flatMap((t) => t.subs));
}

// ---- routing: #m=module&q=&o=&s= | #q=text | #changes | (overview)
function go(p) {
  const h = new URLSearchParams();
  for (const [k, v] of Object.entries(p)) if (v !== undefined && v !== null && v !== "" && v !== 0) h.set(k, typeof v === "string" ? v : JSON.stringify(v));
  location.hash = h.toString();
}
async function route_() {
  const h = location.hash.slice(1);
  document.querySelectorAll(".top").forEach((t) => t.classList.remove("on"));
  if (h === "changes") return showChanges();
  const p = new URLSearchParams(h);
  S.module = p.get("m"); S.q = p.get("q") || ""; S.offset = +(p.get("o") || 0);
  S.select = p.has("s") ? JSON.parse(p.get("s")) : {};
  S.templates = p.get("t") === "1";
  if (S.module) { const t = $(`.top[data-top="${CSS.escape(topOf(S.module))}"]`); if (t) t.classList.add("on"); }
  if (S.module || S.q) return showPage();
  return showOverview();
}
window.addEventListener("hashchange", () => route_().catch(fail));
function fail(e) { $("#main").replaceChildren(el("div", { class: "cbi-section" }, el("div", { class: "err", style: "padding:14px" }, e.message || String(e)))); }

// ---- overview: the corpus by its compiled facets
async function showOverview() {
  const res = await api("/api/query", { select: {}, q: "", offset: 0, limit: 1 });
  $("#crumbs").replaceChildren(el("b", {}, "Overview"));
  $("#stat").textContent = `${res.rows} options · facets in ${res.queryMs.toFixed(2)} ms (query.mlir, compiled)`;
  const facet = (name) => (res.facets.find((f) => f.name === name) || { values: [] }).values;
  const bars = (vals, max = 14) => {
    const top = [...vals].sort((a, b) => b.n - a.n).slice(0, max), m = Math.max(1, ...top.map((v) => v.n));
    return el("div", { class: "bars" }, top.map((v) => el("div", {}, el("span", { class: "mono" }, v.v), el("i", { style: `width:${(100 * v.n) / m}%` }), el("span", {}, v.n))));
  };
  $("#main").replaceChildren(
    el("h2", {}, "The configuration, as a manifest"),
    el("p", { class: "lead" }, `${res.rows} options, each rendered by its facets. Pick a category above; edits are what-ifs that mlnix evaluates, and nothing is written to the system.`),
    el("div", { class: "grid" }, S.tops.map((t) => el("div", { class: "tile" },
      el("h4", {}, t.name, el("span", {}, `${t.n} options`)),
      t.subs.sort((a, b) => b.n - a.n).slice(0, 12).map((s) => el("a", { onclick: () => go({ m: s.v }) }, s.v.includes("/") && t.name !== "local modules" ? s.v.slice(t.name.length + 1) : s.v)),
      t.subs.length > 12 ? el("span", { class: "note" }, ` +${t.subs.length - 12} more in the menu`) : null))),
    el("div", { class: "grid", style: "margin-top:14px" },
      el("div", { class: "tile" }, el("h4", {}, "state", el("span", {}, "compiled facet")), bars(facet("state"))),
      el("div", { class: "tile" }, el("h4", {}, "kind", el("span", {}, "compiled facet")), bars(facet("kind")))));
}

// ---- a page: the options of one module (or a search), grouped into sections by their path
async function showPage() {
  const sel = { ...S.select };
  if (S.module) sel.module = [S.module];
  if (!S.templates && !sel.state) sel.state = S.states.filter((v) => v !== "template");
  const res = await api("/api/query", { select: sel, q: S.q, offset: S.offset, limit: LIMIT });
  const title = S.module || `search “${S.q}”`;
  $("#crumbs").replaceChildren(...(S.module ? [el("a", { href: "#" }, "Overview"), " › ", topOf(S.module), " › ", el("b", {}, S.module)] : [el("a", { href: "#" }, "Overview"), " › ", el("b", {}, title)]));
  $("#stat").textContent = `${res.total} of ${res.rows} options · facets in ${res.queryMs.toFixed(2)} ms (query.mlir, compiled)`;
  const facet = (name) => (res.facets.find((f) => f.name === name) || { values: [] }).values;
  const params = (extra) => ({ m: S.module, q: S.q, s: Object.keys(S.select).length ? S.select : undefined, t: S.templates ? "1" : undefined, ...extra });
  const toggle = (name, v) => {
    const s = { ...S.select }, cur = new Set(s[name] || []);
    cur.has(v) ? cur.delete(v) : cur.add(v);
    if (cur.size) s[name] = [...cur]; else delete s[name];
    go({ ...params(), s: Object.keys(s).length ? s : undefined, o: 0 });
  };
  const chips = (name, label) => facet(name).filter((v) => v.n || v.on).map((v) =>
    el("span", { class: "fchip" + (v.on ? " on" : ""), onclick: () => toggle(name, v.v), title: `${label}: compiled count` }, `${label} ${v.v}`, el("span", { class: "n" }, v.n)));
  const tmpl = facet("state").find((v) => v.v === "template");
  const filters = el("div", { class: "filters" },
    el("input", { type: "text", placeholder: S.module ? "search in this page" : "search", value: S.q, style: "width:220px",
      onkeydown: (e) => { if (e.key === "Enter") go({ ...params(), q: e.target.value.trim(), o: 0 }); } }),
    chips("state", "state"), chips("whatif", "what-if"),
    el("span", { class: "fchip" + (S.templates ? " on" : ""), onclick: () => go({ ...params(), t: S.templates ? undefined : "1", o: 0 }) },
      "templates", el("span", { class: "n" }, tmpl ? tmpl.n : 0)));
  const pager = el("div", { class: "pager" },
    el("button", { disabled: S.offset === 0, onclick: () => go({ ...params(), o: Math.max(0, S.offset - LIMIT) }) }, "‹"),
    `${res.total ? S.offset + 1 : 0}–${Math.min(S.offset + LIMIT, res.total)} of ${res.total}`,

  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = el("div", { class: "diff" });
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && x[i] === y[j]) { out.append(el("div", {}, "  " + x[i])); i++; j++; }
    else if (i < n && (j === m || L[i + 1][j] >= L[i][j + 1])) { out.append(el("div", { class: "del" }, "- " + x[i])); i++; }
    else { out.append(el("div", { class: "add" }, "+ " + y[j])); j++; }
  }
  return out;
}

        el("div", { style: "margin-top:8px" }, el("button", { class: "warn", onclick: () => whatIf("/api/whatif/clear", undefined, err) }, "undo all")), err)),
    el("div", { class: "cbi-section" }, el("div", { class: "head" }, el("h3", {}, m.target ? `adheres as luci.nix, imported by ${m.target}` : "adheres as luci.nix")),
      el("div", { style: "padding:4px 14px 10px" }, el("pre", {}, m.text || m.error))),
    el("div", { class: "cbi-section" }, el("div", { class: "head" }, el("h3", {}, "options it changes"), el("span", { class: "n" }, `${r.options.length}`)),
      el("div", { style: "padding:4px 14px 10px" }, r.options.map((o) => el("div", { class: "rline" }, el("code", {}, o.path),
        o.fromState === o.toState ? "" : el("span", { class: "note" }, `${o.fromState ?? "new"} → ${o.toState}`),
        el("span", { class: "was mono" }, o.from === null ? "" : show(o.from)), "→", el("span", { class: "mono" }, o.to === null ? "" : show(o.to)))))),
    el("div", { class: "cbi-section" }, el("div", { class: "head" }, el("h3", {}, "/etc files it changes"), el("span", { class: "n" }, `${r.etc.length}`)),

}
