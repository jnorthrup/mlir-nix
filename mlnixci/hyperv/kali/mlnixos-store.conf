d /srv/mlnixos/git      0755 jim jim -
d /srv/mlnixos/src      0755 jim jim -
d /srv/mlnixos/build    0755 jim jim -
d /srv/mlnixos/state    0755 jim jim -
d /srv/mlnixos/nixpkgs  0755 jim jim -
